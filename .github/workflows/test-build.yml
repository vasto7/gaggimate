name: Test Build (display only)

# Builds the display firmware with the flow-dependent pressure offset applied,
# and attaches the .bin files to the run as a downloadable artifact.
#
# The build is pinned to the v1.9.0 release tag regardless of which branch you
# push from, so it does not matter that GitHub's web UI can only create branches
# from other branches. Your branch only needs to carry this file and the patch.
#
# The patch is NOT named here. The job picks the highest-numbered
# flow-dependent-offset-vN.patch present on the commit you pushed. An earlier
# version of this file hard-coded the name, and when the name drifted behind the
# branch the build quietly produced the OLD firmware -- it applied cleanly,
# passed every test, and dated the artifact correctly. Deriving the name is the
# fix; out/patch.txt in the artifact is the receipt.
#
# Runs automatically on any push to a branch whose name starts with
# "flow-offset". Do not look for a "Run workflow" button -- GitHub only shows
# that for workflows on the default branch.

on:
  push:
    branches:
      - 'flow-offset**'
  workflow_dispatch:

env:
  BUILD_REF: v1.9.0

jobs:
  build-display:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the v1.9.0 release, not the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'

      - name: Find the newest patch on the pushed branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ${{ github.sha }}

          PATCH_FILE=$(git ls-tree --name-only FETCH_HEAD \
            | grep -E '^flow-dependent-offset-v[0-9]+\.patch$' \
            | sort -V | tail -1)

          if [ -z "${PATCH_FILE}" ]; then
            echo "::error::No flow-dependent-offset-vN.patch found on ${{ github.sha }}."
            echo "Files at the root of that commit:"
            git ls-tree --name-only FETCH_HEAD
            exit 1
          fi

          echo "PATCH_FILE=${PATCH_FILE}" >> "$GITHUB_ENV"
          echo "::notice::Building with ${PATCH_FILE}"

      - name: Fetch and apply the patch
        run: |
          set -euo pipefail
          git checkout FETCH_HEAD -- "${PATCH_FILE}"
          ls -l "${PATCH_FILE}"
          git apply --ignore-whitespace --verbose "${PATCH_FILE}"
          echo "--- files changed ---"
          git status --short

      - name: Record what was built
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "patch:       ${PATCH_FILE}"
            echo "patch_sha256: $(sha256sum "${PATCH_FILE}" | cut -d' ' -f1)"
            echo "base_ref:    ${BUILD_REF}"
            echo "branch:      ${GITHUB_REF_NAME}"
            echo "commit:      ${GITHUB_SHA}"
            echo "built_utc:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee out/patch.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Record version
        run: |
          # These floating tags confuse `git describe`; they may not exist in a fork.
          git tag -d nightly || true
          git tag -d db || true
          # The tree is dirty from the patch, so this stamps the firmware
          # "v1.9.0-dirty" -- semver treats that as a pre-release of 1.9.0, which
          # keeps stock 1.9.0 offered as an update and therefore one press away.
          git describe --tags --dirty --match "v*" > out/version.txt
          cat out/version.txt

      - name: Unit tests for the valve-offset maths
        run: pio test -e native -f test_valve_offset

      - name: Build Web UI
        run: ./scripts/build_webui.sh

      - name: Build display
        run: |
          pio run -e display
          cp .pio/build/display/firmware.bin   out/display-firmware.bin
          cp .pio/build/display/partitions.bin out/display-partitions.bin
          cp .pio/build/display/bootloader.bin out/display-bootloader.bin

      - name: Copy boot_app0
        # Ensures the freshly written app0 image is the one that boots, even
        # though the board was last updated over the air.
        run: cp docs/boot_app0.bin out/boot_app0.bin

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: display-firmware
          path: out/*
          if-no-files-found: error
